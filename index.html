    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#edf4fa,#fff 58%,#fff8e3);line-height:1.6}.top{height:8px;background:linear-gradient(90deg,var(--navy),var(--blue),var(--gold))}.wrap{min-height:calc(100vh - 8px);display:grid;place-items:center;padding:28px}.card{width:min(820px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:26px;padding:clamp(30px,7vw,68px);box-shadow:0 24px 70px rgba(16,43,70,.12);text-align:center}.mark{width:82px;height:82px;margin:0 auto 24px;border:8px solid var(--blue);border-radius:50%;position:relative;background:#fff;box-shadow:inset 0 0 0 8px #fff,inset 0 0 0 16px var(--gold)}.mark:after{content:"";position:absolute;width:42px;height:5px;background:var(--navy);right:-25px;top:30px;transform:rotate(-22deg);border-radius:3px}.eyebrow{color:var(--blue);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}h1{font-size:clamp(2.2rem,6vw,4.3rem);color:var(--navy);line-height:1.06;margin:12px 0 18px}.lead{font-size:clamp(1.05rem,2.2vw,1.25rem);color:#3c4c5c;max-width:610px;margin:0 auto}.rule{width:80px;height:4px;background:var(--gold);border-radius:2px;margin:28px auto}.notice{font-weight:750;color:var(--navy)}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px}.button{display:inline-block;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:800}.primary{color:#fff;background:var(--blue);box-shadow:0 7px 18px rgba(23,105,170,.2)}footer{margin-top:38px;color:var(--muted);font-size:.9rem}@media(max-width:520px){.card{border-radius:19px}.actions{flex-direction:column}.button{width:100%}}
  </style>
